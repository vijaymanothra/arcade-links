<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirect demo</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <div class="icon">✅</div>
    <h1>The redirect worked</h1>
    <p>You opened <code id="from">/play/</code> and were forwarded here. Later this will be the real game.</p>
    <p id="src" hidden>Poster tag carried over: <code></code></p>
    <span class="tag">Demo page</span>
  </main>
  <script>
    var q = new URLSearchParams(location.search);
    if (q.get('from')) document.getElementById('from').textContent = '/' + q.get('from') + '/';
    if (q.get('src')) { var s = document.getElementById('src'); s.querySelector('code').textContent = q.get('src'); s.hidden = false; }
  </script>
</body>
</html>
